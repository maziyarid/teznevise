name: Guard theme integrity

on:
  pull_request:
  push:
    branches: [ main, modifications ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Verify schema ownership and legal import refusal
        run: |
          php scripts/seo-20261110/test-schema-owner.php
          php scripts/seo-20261110/test-trust-reference.php
          php scripts/seo-20261110/test-migration-legal.php

      - name: Lint every PHP file for syntax errors
        run: |
          status=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" > /tmp/lint_out 2>&1; then
              cat /tmp/lint_out
              status=1
            fi
          done < <(find . -name '*.php' -not -path './node_modules/*' -not -path './vendor/*' -not -path './teznevise_work/*' -print0)
          exit $status

  verify-style-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify style.css has required WordPress theme header
        run: |
          if [ ! -f style.css ]; then
            echo "::error file=style.css::style.css is missing entirely — WordPress will not recognize this as a valid theme."
            exit 1
          fi
          missing=0
          for field in "Theme Name" "Version"; do
            if ! grep -qE "^[[:space:]]*${field}:" style.css; then
              echo "::error file=style.css::Missing required theme header field: ${field}"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then exit 1; fi

  verify-header-php-symbols:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify every teznevise_* function called in header.php is defined somewhere
        run: |
          if [ ! -f header.php ]; then
            echo "::error file=header.php::header.php is missing entirely."
            exit 1
          fi
          missing=0
          for fn in $(grep -oE 'teznevise_[a-zA-Z_]+\s*\(' header.php | sed -E 's/[[:space:]]*\($//' | sort -u); do
            if ! grep -rqE "function[[:space:]]+${fn}[[:space:]]*\(" --include='*.php' .; then
              echo "::error file=header.php::header.php calls ${fn}() but no function definition was found anywhere in the theme."
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then exit 1; fi

  release-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Reject a nested theme package
        run: |
          if [ -f teznevise/style.css ] || [ -f teznevise/functions.php ]; then
            echo "::error::Nested theme at teznevise/ is not deployable. Flatten into the repository root."
            exit 1
          fi

      - name: Verify every TEZNEVISE_DIR require_once target exists
        run: python3 scripts/check-release.py

      - name: Classic Editor contract tests
        run: php tests/classic-content-contract.php

      - name: Rebuild frontend bundles and fail on drift
        run: |
          python3 scripts/build-frontend-bundles.py
          git diff --check
          if ! git diff --exit-code -- assets/css/chrome.css assets/css/pages.css assets/js/chrome.js; then
            echo "::error::Generated bundles drifted from source. Commit the rebuilt files."
            exit 1
          fi

      - name: Node syntax check for theme JavaScript
        run: |
          node --check assets/js/chrome.js
          node --check assets/js/react-loader.js
          node --check assets/js/calculators.js

  wordpress-theme-activate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          path: theme-src

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, zip
          coverage: none
          tools: wp-cli

      - name: Install and activate the root theme
        env:
          MYSQL_HOST: 127.0.0.1
        run: |
          curl -sS -o /tmp/wordpress.tar.gz https://wordpress.org/latest.tar.gz
          tar -xzf /tmp/wordpress.tar.gz -C /tmp
          WP=/tmp/wordpress
          mkdir -p "$WP/wp-content/themes/teznevise"
          rsync -a --exclude '.git' --exclude 'teznevise_work' --exclude 'react-app' --exclude 'node_modules' theme-src/ "$WP/wp-content/themes/teznevise/"
          wp config create --path="$WP" --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check
          wp core install --path="$WP" --url=https://teznevise.ir --title=Teznevise --admin_user=admin --admin_password=admin --admin_email=admin@example.com --skip-email
          wp theme activate teznevise --path="$WP"
          EXPECTED=$(grep -oP "define\(\s*'TEZNEVISE_VERSION',\s*'\K[^']+" theme-src/functions.php)
          wp eval --path="$WP" "if (!defined('TEZNEVISE_VERSION') || TEZNEVISE_VERSION !== '$EXPECTED') { fwrite(STDERR, 'version mismatch: got ' . (defined('TEZNEVISE_VERSION') ? TEZNEVISE_VERSION : 'undefined') . ", expected $EXPECTED\n"); exit(1); } echo TEZNEVISE_VERSION, \"\\n\";"
          wp eval --path="$WP" '
            $page = wp_insert_post(array("post_type"=>"page","post_status"=>"publish","post_title"=>"Owned","post_content"=>"Hi","post_name"=>"owned-short"), true);
            if (is_wp_error($page)) { fwrite(STDERR, $page->get_error_message()); exit(1); }
            $result = teznevise_wxr_import_classic_editor(-1, 0);
            $fresh = get_post_field("post_content", $page);
            if (trim($fresh) !== "Hi") { fwrite(STDERR, "short owned content was overwritten\n"); exit(1); }
            echo "importer preserved short owned content\n";
          '

      - name: Start existing isolated WordPress for the blocking render gate
        run: |
          PHP_CLI_SERVER_WORKERS=4 WP_TEST_ROOT=/tmp/wordpress php -S 127.0.0.1:8089 -t /tmp/wordpress theme-src/scripts/seo-20261110/local-router.php > /tmp/wp-render.log 2>&1 &
          python3 - <<'PY'
          import time, urllib.request
          for attempt in range(20):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8089/', timeout=5).read()
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('Local WordPress did not become ready')
          PY
      - name: Blocking local rendered gate including sitemap
        working-directory: theme-src
        run: python3 scripts/seo-20261110/verify_content.py --tier local --base-url http://127.0.0.1:8089 --crawl-sitemap --output local-copy-report.json > local-copy-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wave0-local-render
          path: |
            theme-src/local-copy-report.json
            theme-src/local-copy-output.txt

  wave0-repo-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test strict copy and downgrade gates
        run: |
          python3 scripts/seo-20261110/test_verify_content.py
          python3 scripts/seo-20261110/test_deploy_version.py
          python3 scripts/seo-20261110/validate_inputs.py
      - name: Blocking repository strings gate
        run: python3 scripts/seo-20261110/verify_content.py --tier repo --output repo-copy-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wave0-repo-gate
          path: repo-copy-report.json

  wave0-production-report:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Report production sitemap and required pages (never blocking)
        continue-on-error: true
        run: python3 scripts/seo-20261110/verify_content.py --tier production --base-url https://teznevise.ir --crawl-sitemap --output production-copy-report.json > production-copy-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wave0-production-report
          path: |
            production-copy-report.json
            production-copy-output.txt
