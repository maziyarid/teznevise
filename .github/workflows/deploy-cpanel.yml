name: Deploy Teznevise theme

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Update cPanel repository from GitHub
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          REPOSITORY_ROOT: ${{ secrets.CPANEL_REPOSITORY_ROOT }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --user "${CPANEL_USERNAME}:${CPANEL_API_TOKEN}" \
            --get "https://${CPANEL_HOST}/execute/VersionControl/update" \
            --data-urlencode "repository_root=${REPOSITORY_ROOT}" \
            --data-urlencode "branch=main"

      - name: Deploy cPanel repository
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          REPOSITORY_ROOT: ${{ secrets.CPANEL_REPOSITORY_ROOT }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --user "${CPANEL_USERNAME}:${CPANEL_API_TOKEN}" \
            --get "https://${CPANEL_HOST}/execute/VersionControlDeployment/create" \
            --data-urlencode "repository_root=${REPOSITORY_ROOT}"